<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Management System</title>

    <style>
        .buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:15px 35px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-size:18px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.admin-btn{
    background:#16a34a;
}

.admin-btn:hover{
    background:#15803d;
}
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#2563eb,#4f46e5);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:90%;
            max-width:900px;
            background:white;
            border-radius:20px;
            padding:50px;
            text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
        }

        h1{
            color:#2563eb;
            font-size:48px;
            margin-bottom:15px;
        }

        h2{
            color:#333;
            margin-bottom:20px;
        }

        p{
            color:#666;
            line-height:1.7;
            margin-bottom:30px;
        }

        .features{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
            margin-bottom:40px;
        }

        .card{
            background:#f7f9fc;
            padding:20px;
            border-radius:12px;
            font-weight:bold;
            color:#2563eb;
        }

        .btn{
            display:inline-block;
            padding:15px 35px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-size:18px;
            transition:.3s;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        footer{
            margin-top:40px;
            color:#777;
            font-size:14px;
        }

        @media(max-width:700px){

            h1{
                font-size:34px;
            }

            .features{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

<h1>🚀 CRM Management System</h1>

<h2>Customer Relationship Management</h2>

<p>
Manage Companies, Leads, Contacts, Deals and Analytics
from one powerful dashboard.
</p>

<div class="features">

<div class="card">🏢 Company Management</div>

<div class="card">👥 Contact Management</div>

<div class="card">📈 Lead Tracking</div>

<div class="card">💰 Deal Management</div>

</div>

<div class="buttons">

    <a href="/en/123/789-login/?next=/en/123/" class="btn">
        🔐 CRM Login
    </a>

    <a href="/en/456-admin/" class="btn admin-btn">
        ⚙️ Admin Panel
    </a>

</div>

<footer>

<p>
Developed by Vedant Pandey
</p>

</footer>

</div>

</body>
</html>
